services:
  - type: web
    name: smartattend-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: FACE_MODEL
        value: buffalo_sc
      - key: DET_SIZE
        value: "960"
      - key: CORS_ORIGINS
        sync: false
